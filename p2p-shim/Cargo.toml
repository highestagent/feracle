[package]
name = "p2p_shim"
version = "0.1.0"
edition = "2021"

[lib]
name = "p2p_shim"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
futures = "0.3"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "tokio", "macros"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
